version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: staynova-postgres
    environment:
      POSTGRES_USER: staynova
      POSTGRES_PASSWORD: staynova
      POSTGRES_DB: staynova
    ports:
      - "5432:5432"
    volumes:
      - staynova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staynova -d staynova"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: staynova-redis
    ports:
      - "6379:6379"
    volumes:
      - staynova_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  staynova_postgres_data:
  staynova_redis_data:
